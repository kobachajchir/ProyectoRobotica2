<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Gramática de Infraestructura incorporada al manual AutoFinalRobo2</title>
  <desc id="desc">Esquema documental de portada oscura con grilla y halos, zonas azul ámbar rubí verde, selector con copia recortada, línea de estaciones y superficies sólidas. Es una ilustración de reglas, no una captura de la aplicación.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".12"/></pattern>
    <radialGradient id="cyan"><stop stop-color="#38bdf8" stop-opacity=".24"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="ruby"><stop stop-color="#ff6b7d" stop-opacity=".28"/><stop offset="1" stop-color="#ff6b7d" stop-opacity="0"/></radialGradient>
    <linearGradient id="headline"><stop stop-color="#7dd3fc"/><stop offset=".55" stop-color="#ff8a9a"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
    <linearGradient id="journey"><stop stop-color="#0369a1"/><stop offset=".33" stop-color="#b45309"/><stop offset=".67" stop-color="#b81d33"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <clipPath id="banner"><rect x="48" y="118" width="1344" height="380" rx="24"/></clipPath>
    <clipPath id="pill"><rect x="66" y="592" width="184" height="44" rx="22"/></clipPath>
  </defs>
  <rect width="1440" height="1080" fill="#f3f6fb"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="48" y="51" fill="#0f172a" font-size="30" font-weight="700">Gramática visual · AutoFinalRobo2</text>
    <text x="48" y="83" fill="#475569" font-size="16">Ampliación del manual 0.1.11 · referencia Infraestructura · esquema documental, no captura</text>
    <g clip-path="url(#banner)">
      <rect x="48" y="118" width="1344" height="380" fill="#0b1424"/>
      <ellipse cx="1260" cy="148" rx="430" ry="240" fill="url(#cyan)"/>
      <ellipse cx="260" cy="500" rx="520" ry="270" fill="url(#ruby)"/>
      <rect x="48" y="118" width="1344" height="380" fill="url(#grid)"/>
    </g>
    <rect x="48" y="118" width="1344" height="380" rx="24" fill="none" stroke="#94a3b8" stroke-opacity=".18"/>
    <rect x="84" y="150" width="100" height="29" rx="15" fill="#ff6b7d" fill-opacity=".22" stroke="#ff6b7d" stroke-opacity=".55"/>
    <text x="101" y="170" fill="#f8fafc" font-size="13">EXPLORAR</text>
    <text x="84" y="230" fill="#f8fafc" font-size="38" font-weight="750">Una portada que explica.</text>
    <text x="84" y="275" fill="url(#headline)" font-size="38" font-weight="750">Un color que acompaña el viaje.</text>
    <text x="84" y="311" fill="#e2e8f0" font-size="17">Base oscura + grilla de 32 px + halos radiales + contenido nítido.</text>
    <g font-size="15" font-weight="650" text-anchor="middle">
      <rect x="84" y="344" width="280" height="72" rx="18" fill="#7dd3fc" fill-opacity=".06" stroke="#7dd3fc" stroke-opacity=".45" stroke-dasharray="5 5"/>
      <text x="224" y="375" fill="#7dd3fc">COMPUTADORA</text><text x="224" y="399" fill="#e2e8f0" font-size="13" font-weight="400">Diseño y preparación</text>
      <path d="M370 380H404" stroke="#e2e8f0" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 5"/><circle cx="390" cy="380" r="4" fill="#ff8a9a"/>
      <rect x="412" y="344" width="280" height="72" rx="18" fill="#fcd34d" fill-opacity=".06" stroke="#fcd34d" stroke-opacity=".45" stroke-dasharray="5 5"/>
      <text x="552" y="375" fill="#fcd34d">ESP8266</text><text x="552" y="399" fill="#e2e8f0" font-size="13" font-weight="400">Almacenamiento y servidor</text>
      <path d="M700 380H734" stroke="#e2e8f0" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 5"/><circle cx="720" cy="380" r="4" fill="#ff8a9a"/>
      <rect x="742" y="344" width="280" height="72" rx="18" fill="#ff8a9a" fill-opacity=".06" stroke="#ff8a9a" stroke-opacity=".45" stroke-dasharray="5 5"/>
      <text x="882" y="375" fill="#ff8a9a">WI-FI</text><text x="882" y="399" fill="#e2e8f0" font-size="13" font-weight="400">Transferencia, no alarma</text>
      <path d="M1030 380H1064" stroke="#e2e8f0" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 5"/><circle cx="1050" cy="380" r="4" fill="#ff8a9a"/>
      <rect x="1072" y="344" width="280" height="72" rx="18" fill="#86efac" fill-opacity=".06" stroke="#86efac" stroke-opacity=".45" stroke-dasharray="5 5"/>
      <text x="1212" y="375" fill="#86efac">NAVEGADOR</text><text x="1212" y="399" fill="#e2e8f0" font-size="13" font-weight="400">Interfaz y gráficos</text>
    </g>
    <text x="84" y="463" fill="#e2e8f0" font-size="14">Las cuatro familias se muestran como leyenda: el mapa real agrupa sus nodos en tres carriles.</text>
    <text x="48" y="548" fill="#0f172a" font-size="25" font-weight="700">Selección, jerarquía y datos</text>
    <rect x="48" y="574" width="640" height="210" rx="24" fill="#fff" stroke="#0f172a" stroke-opacity=".16"/>
    <rect x="62" y="588" width="390" height="52" rx="26" fill="#eaf0f8" stroke="#0f172a" stroke-opacity=".09"/>
    <g fill="#475569" font-size="13" text-anchor="middle"><text x="158" y="619">Viaje de la Web</text><text x="348" y="619">Viaje del modelo 3D</text></g>
    <g clip-path="url(#pill)"><rect x="66" y="592" width="382" height="44" fill="#fff"/><g fill="#0f172a" font-size="13" text-anchor="middle"><text x="158" y="619">Viaje de la Web</text><text x="348" y="619">Viaje del modelo 3D</text></g></g>
    <text x="74" y="683" fill="#0f172a" font-size="18" font-weight="650">Una copia activa recortada</text>
    <text x="74" y="714" fill="#475569" font-size="15">Fondo, texto e icono cambian juntos.</text>
    <text x="74" y="744" fill="#64748b" font-size="13">clip-path · 250 ms · teclado y resize inmediatos</text>
    <rect x="712" y="574" width="680" height="210" rx="24" fill="#fff" stroke="#0f172a" stroke-opacity=".16"/>
    <path d="M758 624H1346" stroke="#0f172a" stroke-opacity=".16" stroke-width="4"/>
    <path d="M758 624H1088" stroke="url(#journey)" stroke-width="4"/>
    <g stroke-width="2" font-size="13" font-weight="700" text-anchor="middle">
      <circle cx="758" cy="624" r="23" fill="#0369a1" stroke="#0369a1"/><text x="758" y="629" fill="#fff">✓</text>
      <circle cx="954" cy="624" r="23" fill="#b45309" stroke="#b45309"/><text x="954" y="629" fill="#fff">✓</text>
      <circle cx="1150" cy="624" r="30" fill="#b81d33" fill-opacity=".11"/><circle cx="1150" cy="624" r="26" fill="#fff" stroke="#b81d33"/><text x="1150" y="629" fill="#b81d33">03</text>
      <circle cx="1346" cy="624" r="23" fill="#fff" stroke="#0f172a" stroke-opacity=".28"/><text x="1346" y="629" fill="#475569">04</text>
    </g>
    <text x="738" y="683" fill="#0f172a" font-size="18" font-weight="650">Estado visible, significado explícito</text>
    <text x="738" y="714" fill="#475569" font-size="15">Check anterior · halo actual · número siguiente</text>
    <text x="738" y="744" fill="#64748b" font-size="13">Línea: scaleX 520 ms · progreso de selección, no ejecución</text>
    <g>
      <rect x="48" y="808" width="420" height="170" rx="24" fill="#fff" stroke="#0f172a" stroke-opacity=".16"/>
      <text x="72" y="840" fill="#64748b" font-size="12">JERARQUÍA</text><text x="72" y="875" fill="#0f172a" font-size="25" font-weight="700">Título + contexto</text><text x="72" y="907" fill="#475569" font-size="15">Kicker, título, explicación y acción.</text><text x="72" y="946" fill="#64748b" font-size="13">Radio 24 px · padding fluido · borde sutil</text>
      <rect x="486" y="808" width="420" height="170" rx="24" fill="#fff" stroke="#0f172a" stroke-opacity=".16"/>
      <text x="510" y="840" fill="#64748b" font-size="12">MAGNITUDES</text><text x="510" y="875" fill="#0f172a" font-size="25" font-weight="700">Valor + unidad + origen</text><rect x="510" y="898" width="372" height="14" rx="7" fill="#eaf0f8"/><rect x="510" y="898" width="250" height="14" rx="7" fill="url(#journey)"/><text x="510" y="946" fill="#64748b" font-size="13">Fills animados · cifras tabulares · ausencia explícita</text>
      <rect x="924" y="808" width="468" height="170" rx="24" fill="#eaf0f8" stroke="#0f172a" stroke-opacity=".09"/>
      <text x="948" y="840" fill="#64748b" font-size="12">CONTINUIDAD DEL SISTEMA</text><text x="948" y="875" fill="#0f172a" font-size="25" font-weight="700">La identidad existente continúa</text><text x="948" y="907" fill="#475569" font-size="15">Marca, controles, formularios, overlays y OLED.</text><text x="948" y="946" fill="#64748b" font-size="13">Expresividad en Explorar · acceso directo en Operar</text>
    </g>
    <text x="48" y="1030" fill="#64748b" font-size="14">Esquema propuesto de documentación: resume proporciones y reglas; no reproduce medidas de un viewport real.</text>
  </g>
</svg>
