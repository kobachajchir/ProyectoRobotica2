[env:esp12s_candidate]
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
; AFR2-20261024-04: 4 MiB flash / nominal 3 MiB LittleFS requested by user.
; Candidate only; physical flash and SPI still require identification before upload.
board_build.ldscript = eagle.flash.4m3m.ld
upload_speed = 115200
monitor_speed = 115200
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    ESP32Async/ESPAsyncTCP @ 2.0.0
    ESP32Async/ESPAsyncWebServer @ 3.10.3
    bblanchon/ArduinoJson @ 7.4.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../AutoFinalRobo2-Contracts/contracts
    -D ASYNCWEBSERVER_USE_CHUNK_INFLIGHT=0
    -D WS_MAX_QUEUED_MESSAGES=4
extra_scripts = pre:tools/async_tcp_copy_buffers.py
; Candidate only: board does NOT identify physical flash, SPI mode or filesystem layout.
; Web includes final CAD model; software budget 2800 KiB (AFR2-20261024-04).
; Select matching firmware/FS layout only after physical identification; no ESP01 linker copy.
; No build, filesystem image, serial monitor, format or upload is run by editing this file.
