; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
upload_speed = 115200
board_build.flash_mode = dout
board_build.ldscript = linker/eagle.flash.4m3m.ld
board_build.filesystem = littlefs
board_build.flash_size = 4MB
monitor_speed = 115200
extra_scripts = pre:tools/websocket_copy_buffers.py
lib_compat_mode = strict
lib_ldf_mode = chain
build_flags =
	-D ASYNCWEBSERVER_USE_CHUNK_INFLIGHT=0
lib_deps = 
	ESP32Async/ESPAsyncTCP @ 2.0.0
	ESP32Async/ESPAsyncWebServer @ 3.10.3
	bblanchon/ArduinoJson @ 7.4.2

; Segunda pila UNER pre-v2, sin consumidores productivos. Se conserva solo
; como referencia de migracion y queda fuera de todos los builds activos.
build_src_filter =
	+<*>
	-<UNERUtils.cpp>
	-<uner_device.c>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
	-Wall
	-Wextra
build_src_filter =
	-<*>
	+<uner_core.c>
	+<uner_queue.c>
	+<uner_cmdspec.c>
	+<uner_handle.cpp>
	+<uner_handle_compat.cpp>
	+<timebase_core.cpp>
	+<wifi_status_led_core.cpp>
	+<sensors.cpp>
	+<nvs_store.cpp>
	+<wifi_service.cpp>
	+<boot_mode.cpp>
	+<f4_command_registry.c>
	+<f4_payload_decoders.c>
	+<f4_extension_profiles.c>
	+<oled_canvas_transfer.c>
	+<uart_transaction_manager.c>
	+<ws_session_manager.c>
	+<stream_broker.c>
	+<stream_request_waiters.c>
	+<wifi_scan_arbiter.c>
	+<wifi_scan_snapshot.c>
