<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5163"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2430">D-10 · Odometría por ruedas: de los pulsos Hall a la pose (x, y, ψ)</text><rect x="40" y="48" width="64" height="3" fill="#b81d33"/><path d="M220.0,144.0 L220.0,179.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M220.0,237.0 L220.0,271.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M220.0,329.0 L220.0,363.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M220.0,421.0 L220.0,455.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M380.0,484.0 L410.0,484.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M580.0,449.0 L580.0,421.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M580.0,363.0 L580.0,331.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M580.0,269.0 L580.0,234.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M580.0,182.0 L580.0,142.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="40" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5163" text-anchor="start">Sin giroscopio: la deriva de rumbo crece con la distancia. |Δn| &gt; 100000 invalida la pose (F2).</text><rect x="60.0" y="88.0" width="320" height="56" rx="8" fill="#efe9ff" stroke="#6a4bb5" stroke-width="1.6"/><text x="220.0" y="113.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Hall ×4 · flanco ↑ de A, B = sentido</text><text x="220.0" y="129.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">(IRQ PCINT2, puerto K, máscara 0x0F)</text><rect x="60.0" y="179.0" width="320" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Δn_i = n_i(k) − n_i(k−1)</text><text x="220.0" y="221.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">contadores en orden FL, FR, RL, RR</text><rect x="60.0" y="271.0" width="320" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="297.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Normaliza signos: hall_signs / hall_cw_mask</text><text x="220.0" y="313.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">(derechas: CW exterior = avance)</text><rect x="60.0" y="363.0" width="320" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="389.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Δs_i = Δn_i · π · D / N_i</text><text x="220.0" y="405.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">D = 80 mm · N_i = 370  (0,679 mm/cuenta)</text><rect x="60.0" y="455.0" width="320" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="481.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">u_i = Δs_i / Δt  → velocidad por rueda</text><text x="220.0" y="497.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">(realimenta el PID)</text><rect x="410.0" y="449.0" width="340" height="70" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="580.0" y="473.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Mezcla inversa (4 ruedas → 3 velocidades)</text><text x="580.0" y="489.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Δx = ¼ΣΔs · Δy = ¼(−s1+s2+s3−s4)</text><text x="580.0" y="505.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Δψ = ¼(−s1+s2−s3+s4)/L  (L = 170 mm)</text><rect x="410.0" y="363.0" width="340" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="580.0" y="389.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Factor direccional medido (odom_scale)</text><text x="580.0" y="405.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">avance/retro ×1,000 · lateral ×0,775 · giro ×1,000</text><rect x="410.0" y="269.0" width="340" height="62" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="580.0" y="289.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Rumbo medio: ψm = ψ + Δψ/2</text><text x="580.0" y="305.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">x += Δx·cosψm − Δy·sinψm</text><text x="580.0" y="321.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">y += Δx·sinψm + Δy·cosψm</text><rect x="430.0" y="182.0" width="300" height="52" rx="8" fill="#e3f5ea" stroke="#2a8a52" stroke-width="1.6"/><text x="580.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Pose: x_mm, y_mm, yaw_mrad (±π)</text><text x="580.0" y="221.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">pose_valid = 1</text><rect x="420.0" y="90.0" width="320" height="52" rx="8" fill="#e4f0ff" stroke="#2d6cb5" stroke-width="1.6"/><text x="580.0" y="113.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Usos: GOTO (error), telemetría Web,</text><text x="580.0" y="129.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">mapa y prueba de odometría</text></svg>