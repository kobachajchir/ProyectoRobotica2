size="12" font-weight="700" fill="#b81d33" text-anchor="middle">no</text><path d="M565.0,548.0 L565.0,484.0 L830.0,484.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="573.0" y="536.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="start">sí</text><text x="40" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5163" text-anchor="start">Un solo lazo cooperativo de 10 ms. STOP, TTL de 400 ms por consigna y corte de 1,5 s sin pulso Web apagan las salidas.</text><rect x="85.0" y="94.0" width="260" height="44" rx="22.0" fill="#1f2430" stroke="#1f2430"/><text x="215.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff">Afr2Product_Task(now)</text><rect x="65.0" y="179.0" width="300" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="215.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Sensores (Hall, IR, HC-SR04, batería)</text><text x="215.0" y="221.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">medición Hall manual · EEPROM</text><rect x="60.0" y="271.0" width="310" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="215.0" y="297.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Vencimientos: origen local / Web (1,5 s) /</text><text x="215.0" y="313.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">consigna manual → Stop (salidas a 0)</text><rect x="65.0" y="363.0" width="300" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="215.0" y="389.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Secuencias · ¿pasaron ≥ 10 ms?</text><text x="215.0" y="405.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">(si no, termina el servicio)</text><polygon points="215.0,456.0 318.0,484.0 215.0,512.0 112.0,484.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="215.0" y="481.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">¿dt &gt; 100 ms con</text><text x="215.0" y="497.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">PWM aplicado?</text><rect x="430.0" y="453.0" width="270" height="62" rx="8" fill="#fde7ea" stroke="#b81d33" stroke-width="1.6"/><text x="565.0" y="473.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Corta salidas · F1</text><text x="565.0" y="489.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">3 en 2 s = F1 enclavado</text><text x="565.0" y="505.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">(PWM manual: solo registra)</text><rect x="65.0" y="547.0" width="300" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="215.0" y="573.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Odometría (ver D-10)</text><text x="215.0" y="589.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Δn → Δs → (Δx, Δy, Δψ) → pose</text><rect x="50.0" y="639.0" width="330" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="215.0" y="665.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Modo LÍNEA / GOTO / MANUAL / PWM / TEST</text><text x="215.0" y="681.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">→ (vx, vy, ωz) → Drive → u_i por rueda</text><rect x="420.0" y="633.0" width="290" height="70" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="565.0" y="657.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">PID por rueda (Q8): e = u_ref − u_med</text><text x="565.0" y="673.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">salida = (Kp·e + Ki·∫e + Kd·Δe)/256</text><text x="565.0" y="689.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">rampa ±4 · límite 255</text><polygon points="565.0,548.0 693.0,576.0 565.0,604.0 437.0,576.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="565.0" y="573.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">¿signo PWM/Hall cruzado (F4)</text><text x="565.0" y="589.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">o sin pulsos 500 ms (F3)?</text><rect x="790.0" y="554.0" width="250" height="44" rx="22.0" fill="#1f2430" stroke="#1f2430"/><text x="915.0" y="581.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff">Motor_Write(pwm, signos)</text><rect x="830.0" y="464.0" width="170" height="40" rx="8" fill="#fde7ea" stroke="#b81d33" stroke-width="1.6"/><text x="915.0" y="489.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Stop + fallo</text></svg>