<svg xmlns="http://www.w3.org/2000/svg" width="860" height="764" viewBox="0 0 860 764"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5163"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2430">D-03a · Ciclo principal del ATmega2560 (main.c)</text><rect x="40" y="48" width="64" height="3" fill="#b81d33"/><path d="M220.0,142.0 L220.0,179.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M220.0,237.0 L220.0,271.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M220.0,329.0 L220.0,360.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M220.0,424.0 L220.0,455.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M220.0,513.0 L220.0,547.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M220.0,605.0 L220.0,646.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M380.0,668.0 L462.0,668.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M580.0,640.0 L580.0,605.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="590.0" y="626.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="start">sí</text><path d="M580.0,605.0 L580.0,455.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M698.0,668.0 L755.0,668.0 L755.0,484.0 L730.0,484.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="715.0" y="662.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">no</text><path d="M580.0,513.0 L580.0,370.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M455.0,392.0 L390.0,392.0 L390.0,300.0 L385.0,300.0 L380.0,300.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="455.0" y="358.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">vuelve al ciclo</text><text x="40" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5163" text-anchor="start">Con reinicio diferido pendiente y el UART libre, el ciclo termina en Watchdog_Reboot. Ninguna ISR hace trabajo caro: todo ocurre en main.</text><rect x="60.0" y="90.0" width="320" height="52" rx="26.0" fill="#1f2430" stroke="#1f2430"/><text x="220.0" y="113.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff">Arranque: Board, Debug, Product, UART1, UI,</text><text x="220.0" y="129.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff">App, Link, Encoder, TWI, OLED (último)</text><rect x="60.0" y="179.0" width="320" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Watchdog ON · sei()</text><text x="220.0" y="221.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">las salidas quedan apagadas</text><rect x="60.0" y="271.0" width="320" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="297.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">① App_Task(now)</text><text x="220.0" y="313.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">servicios del producto (ver D-03b)</text><rect x="55.0" y="360.0" width="330" height="64" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="381.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">② Enlace ESP: Link_Tick, ≤ 64 bytes de USART1</text><text x="220.0" y="397.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">parser ROBO2 → comando → respuesta</text><text x="220.0" y="413.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">(si falta, envía el BT01 de arranque)</text><rect x="55.0" y="455.0" width="330" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="481.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">③ Encoder: drena ≤ 32 transiciones → giro UI</text><text x="220.0" y="497.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">botón corto/largo, ambos al soltar (≥ 800 ms)</text><rect x="55.0" y="547.0" width="330" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="573.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">④ Si hay marcha y el control venció (≥ 10 ms):</text><text x="220.0" y="589.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">App_Task otra vez, antes de dibujar</text><rect x="60.0" y="646.0" width="320" height="44" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="220.0" y="673.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">⑤ TWI + I2C Manager (tick)</text><polygon points="580.0,640.0 698.0,668.0 580.0,696.0 462.0,668.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="580.0" y="665.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">⑥ ¿redraw y ≥ 40 ms</text><text x="580.0" y="681.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">desde el último cuadro?</text><rect x="445.0" y="547.0" width="270" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="580.0" y="581.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Render UI → framebuffer 128×64</text><rect x="430.0" y="455.0" width="300" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="580.0" y="481.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">⑦ Oled_Task: ≤ 16 bytes por turno,</text><text x="580.0" y="497.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">1 etapa cada 2 ms (no bloquea)</text><rect x="455.0" y="370.0" width="250" height="44" rx="22.0" fill="#1f2430" stroke="#1f2430"/><text x="580.0" y="397.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff">⑧ Watchdog_Kick</text></svg>