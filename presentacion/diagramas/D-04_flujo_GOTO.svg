<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="856" viewBox="0 0 1130 856"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5163"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2430">D-04 · Programa GOTO: del pedido a la llegada (ATmega, cada 10 ms)</text><rect x="40" y="48" width="64" height="3" fill="#b81d33"/><path d="M205.0,147.0 L205.0,174.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M348.0,208.0 L420.0,208.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="384.0" y="200.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">no</text><path d="M205.0,242.0 L205.0,269.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="215.0" y="258.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="start">sí</text><path d="M205.0,331.0 L205.0,364.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M308.0,392.0 L420.0,392.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="364.0" y="384.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">no</text><path d="M205.0,420.0 L205.0,455.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="215.0" y="436.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="start">sí</text><path d="M205.0,513.0 L205.0,548.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M313.0,576.0 L420.0,576.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="366.5" y="568.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">sí</text><path d="M205.0,604.0 L205.0,637.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="215.0" y="620.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="start">no</text><path d="M205.0,699.0 L205.0,734.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M355.0,760.0 L390.0,760.0 L390.0,347.5 L205.0,347.5 L205.0,364.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="495.0" y="748.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">siguiente ciclo (10 ms)</text><rect x="70.0" y="85.0" width="270" height="62" rx="8" fill="#e4f0ff" stroke="#2d6cb5" stroke-width="1.6"/><text x="205.0" y="105.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Pedido GOTO (0x16)</text><text x="205.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">X, Y [mm] relativos al rumbo,</text><text x="205.0" y="137.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">θ [mrad] opcional, v [mm/s]</text><polygon points="205.0,174.0 348.0,208.0 205.0,242.0 62.0,208.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="205.0" y="197.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">¿|X|,|Y| ≤ 5000 · |θ| ≤ 3140</text><text x="205.0" y="213.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">10 ≤ v ≤ límite · sin fallo ·</text><text x="205.0" y="229.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">pose válida · motores calibrados?</text><rect x="420.0" y="182.0" width="230" height="52" rx="8" fill="#fde7ea" stroke="#b81d33" stroke-width="1.6"/><text x="535.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Rechazo: BAD / DENIED /</text><text x="535.0" y="221.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">UNAVAILABLE / BUSY</text><rect x="70.0" y="269.0" width="270" height="62" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="205.0" y="289.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Objetivo en el mundo:</text><text x="205.0" y="305.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">(xm, ym) = (x, y) + R(ψ)·(X, Y)</text><text x="205.0" y="321.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">ψm = ψ + θ</text><polygon points="205.0,364.0 308.0,392.0 205.0,420.0 102.0,392.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="205.0" y="389.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">¿pose válida y</text><text x="205.0" y="405.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">t &lt; 60 s?</text><rect x="420.0" y="370.0" width="230" height="44" rx="8" fill="#fde7ea" stroke="#b81d33" stroke-width="1.6"/><text x="535.0" y="397.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Estado 4 (fallo) · Stop</text><rect x="60.0" y="455.0" width="290" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="205.0" y="481.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Error: ex = xm − x · ey = ym − y</text><text x="205.0" y="497.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">eψ = ψm − ψ  (normalizado ±π)</text><polygon points="205.0,548.0 313.0,576.0 205.0,604.0 97.0,576.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="205.0" y="573.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">¿|ex|,|ey| ≤ 10 mm</text><text x="205.0" y="589.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">y |eψ| ≤ 25 mrad?</text><rect x="420.0" y="550.0" width="230" height="52" rx="8" fill="#e3f5ea" stroke="#2a8a52" stroke-width="1.6"/><text x="535.0" y="573.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Llegó: estado 2 · Stop</text><text x="535.0" y="589.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">aviso OLED/Web</text><rect x="60.0" y="637.0" width="290" height="62" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="205.0" y="657.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Al marco del robot:</text><text x="205.0" y="673.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">vx = ex·cosψ + ey·sinψ</text><text x="205.0" y="689.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">vy = −ex·sinψ + ey·cosψ · ωz = eψ</text><rect x="55.0" y="734.0" width="300" height="52" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="205.0" y="757.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Mínimo 40 mm/s · normaliza</text><text x="205.0" y="773.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">|vx|+|vy|+|ωz|·L ≤ v  → Drive(vx, vy, ωz)</text><rect x="720.0" y="627.0" width="290" height="82" rx="4" fill="#ffffff" stroke="#9aa1b2" stroke-dasharray="5 3"/><text x="865.0" y="649.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Web (1.23.x): la ruta simulada se</text><text x="865.0" y="665.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">envía como tramos consecutivos</text><text x="865.0" y="681.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">robot.goto.start; espera robot.state</text><text x="865.0" y="697.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">antes del siguiente tramo.</text></svg>