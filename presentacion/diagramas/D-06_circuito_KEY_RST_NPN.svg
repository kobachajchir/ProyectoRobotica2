<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660"><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2430">D-06 · KEY y RST automáticos del ESP con transistores NPN (propuesta, sin armar/medir)</text><rect x="40" y="48" width="64" height="3" fill="#b81d33"/><rect x="40" y="190" width="110" height="46" rx="6" fill="#efe9ff" stroke="#6a4bb5" stroke-width="1.6"/><text x="95" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">Mega</text><text x="95" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b81d33">D32 (PC5)</text><path d="M150,213 L175,213" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M175,213 l8,-12 l12,24 l12,-24 l12,24 l12,-24 l8,12" stroke="#4a5163" stroke-width="2" fill="none"/><text x="215" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">R1 1 kΩ</text><path d="M239,213 L292,213" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M292,190 L292,236" stroke="#1f2430" stroke-width="4" fill="none"/><path d="M292,202 L334,168 L334,140" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M292,224 L334,258 L334,300" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M320,248 L334,258 L321,260" stroke="#1f2430" stroke-width="2" fill="#1f2430"/><text x="300" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2430">Q1</text><text x="344" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">C (colector)</text><text x="344" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">E (emisor)</text><text x="268" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">B</text><path d="M274,213 L274,240" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M274,240 l-9,6 l18,12 l-18,12 l18,12 l-9,6" stroke="#4a5163" stroke-width="2" fill="none"/><text x="242" y="282" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">R3 10 kΩ</text><path d="M274,288 L274,310 L334,310" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M334,300 L334,316" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M321.0,316 L347.0,316" stroke="#1f2430" stroke-width="2"/><path d="M325.0,322 L343.0,322" stroke="#1f2430" stroke-width="2"/><path d="M329.0,328 L339.0,328" stroke="#1f2430" stroke-width="2"/><text x="354" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">GND común (Mega = shield)</text><path d="M334,140 L334,122 L442,122" stroke="#4a5163" stroke-width="2" fill="none"/><rect x="442" y="100" width="190" height="44" rx="6" fill="#e4f0ff" stroke="#2d6cb5" stroke-width="1.6"/><text x="537" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">Pata de señal del</text><text x="537" y="134" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2430">pulsador KEY (GPIO0)</text><rect x="40" y="460" width="110" height="46" rx="6" fill="#efe9ff" stroke="#6a4bb5" stroke-width="1.6"/><text x="95" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">Mega</text><text x="95" y="498" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#b81d33">D33 (PC4)</text><path d="M150,483 L175,483" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M175,483 l8,-12 l12,24 l12,-24 l12,24 l12,-24 l8,12" stroke="#4a5163" stroke-width="2" fill="none"/><text x="215" y="458" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">R2 1 kΩ</text><path d="M239,483 L292,483" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M292,460 L292,506" stroke="#1f2430" stroke-width="4" fill="none"/><path d="M292,472 L334,438 L334,410" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M292,494 L334,528 L334,570" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M320,518 L334,528 L321,530" stroke="#1f2430" stroke-width="2" fill="#1f2430"/><text x="300" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2430">Q2</text><text x="344" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">C (colector)</text><text x="344" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">E (emisor)</text><text x="268" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">B</text><path d="M274,483 L274,510" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M274,510 l-9,6 l18,12 l-18,12 l18,12 l-9,6" stroke="#4a5163" stroke-width="2" fill="none"/><text x="242" y="552" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">R4 10 kΩ</text><path d="M274,558 L274,580 L334,580" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M334,570 L334,586" stroke="#4a5163" stroke-width="2" fill="none"/><path d="M321.0,586 L347.0,586" stroke="#1f2430" stroke-width="2"/><path d="M325.0,592 L343.0,592" stroke="#1f2430" stroke-width="2"/><path d="M329.0,598 L339.0,598" stroke="#1f2430" stroke-width="2"/><text x="354" y="604" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1f2430">GND común (Mega = shield)</text><path d="M334,410 L334,392 L442,392" stroke="#4a5163" stroke-width="2" fill="none"/><rect x="442" y="370" width="190" height="44" rx="6" fill="#e4f0ff" stroke="#2d6cb5" stroke-width="1.6"/><text x="537" y="388" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">Pata de señal del</text><text x="537" y="404" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2430">pulsador RST (reset)</text><text x="740" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">• NPN en paralelo con cada pulsador del shield:</text><text x="740" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">  el pulsador sigue funcionando a mano.</text><text x="740" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">• Pin en alto = pulsador "apretado" (colector a ~0 V).</text><text x="740" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">• Pin en bajo o alta impedancia = suelto; los 10 kΩ</text><text x="740" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">  aseguran "suelto" durante el arranque.</text><text x="740" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">• Al arrancar D32/D33 son entradas sin pull-up.</text><text x="740" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">• Solo hay carga automática si el usuario la pide.</text><text x="740" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#b81d33">Secuencia de entrada en modo carga</text><text x="740" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">1  KEY alto (GPIO0 a masa)</text><text x="740" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">2  espera 20 ms</text><text x="740" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">3  RST alto 100 ms → RST bajo (reinicio)</text><text x="740" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">4  ~200 ms con KEY apretado</text><text x="740" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">5  puente transparente + esptool</text><text x="740" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2430">6  se suelta KEY y el ESP arranca</text><text x="40" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5163">Transistor 2N3904 (E-B-C) o BC547 (C-B-E): verificar patas con la hoja de datos. Estado: implementado en fuente (AFR2-20261106-11); circuito sin armar ni medir.</text></svg>