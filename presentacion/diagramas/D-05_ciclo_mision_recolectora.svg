</text><path d="M710.0,668.0 L810.0,668.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="760.0" y="660.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">no</text><path d="M585.0,694.0 L585.0,734.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M460.0,760.0 L363.0,760.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M147.0,760.0 L70.0,760.0 L70.0,208.0 L105.0,208.0 L105.0,208.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="95.0" y="752.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">sí</text><path d="M255.0,788.0 L255.0,820.0 L775.0,820.0 L775.0,760.0 L795.0,760.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="265.0" y="816.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="start">no</text><text x="40" y="882" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5163" text-anchor="start">La base permanece detenida mientras el brazo manipula. Es simulación local de la Web: no hay misión física completa verificada.</text><rect x="105.0" y="94.0" width="300" height="44" rx="22.0" fill="#1f2430" stroke="#1f2430"/><text x="255.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff">Inicio: robot detenido, brazo recogido</text><rect x="105.0" y="177.0" width="300" height="62" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="255.0" y="197.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Barrido del HC-SR04 con base quieta</text><text x="255.0" y="213.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">37 direcciones a 5° · 300 ms de posicionado</text><text x="255.0" y="229.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">+ 250 ms por dirección</text><polygon points="255.0,272.0 368.0,300.0 255.0,328.0 142.0,300.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="255.0" y="297.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">¿candidato de cubo</text><text x="255.0" y="313.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">(eco + tamaño conocido)?</text><rect x="475.0" y="278.0" width="220" height="44" rx="8" fill="#fde7ea" stroke="#b81d33" stroke-width="1.6"/><text x="585.0" y="305.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Fin: objetivo perdido</text><rect x="120.0" y="363.0" width="270" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="255.0" y="389.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Orientar / centrar al candidato</text><text x="255.0" y="405.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">+ eco frontal reciente</text><rect x="120.0" y="455.0" width="270" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="255.0" y="481.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Aproximar (Mecanum) → detener</text><text x="255.0" y="497.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">→ medir otra vez → preagarre</text><polygon points="255.0,548.0 373.0,576.0 255.0,604.0 137.0,576.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="255.0" y="573.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">¿IK vertical con trayectoria</text><text x="255.0" y="589.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">válida y alcanzable?</text><rect x="470.0" y="551.0" width="230" height="50" rx="8" fill="#fde7ea" stroke="#b81d33" stroke-width="1.6"/><text x="585.0" y="573.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Fin: inalcanzable /</text><text x="585.0" y="589.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">trayectoria bloqueada</text><rect x="460.0" y="642.0" width="250" height="52" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="585.0" y="665.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Tomar → ¿agarre OK?</text><text x="585.0" y="681.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Elevar → llevar sobre celda</text><rect x="810.0" y="646.0" width="210" height="44" rx="8" fill="#fde7ea" stroke="#b81d33" stroke-width="1.6"/><text x="915.0" y="673.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Fin: agarre fallido</text><rect x="460.0" y="734.0" width="250" height="52" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="585.0" y="757.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Soltar en la celda del depósito</text><text x="585.0" y="773.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">→ recoger brazo</text><polygon points="255.0,732.0 363.0,760.0 255.0,788.0 147.0,760.0" fill="#fff4d6" strok