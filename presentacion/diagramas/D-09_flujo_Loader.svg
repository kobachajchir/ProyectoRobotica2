<svg xmlns="http://www.w3.org/2000/svg" width="1315" height="360" viewBox="0 0 1315 360"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5163"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2430">D-09 · AFR2 Loader: de la fuente al equipo (Windows, C#)</text><rect x="40" y="48" width="64" height="3" fill="#b81d33"/><path d="M257.5,130.0 L292.5,130.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M492.5,130.0 L527.5,130.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M727.5,130.0 L779.5,130.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M945.5,130.0 L990.0,130.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="967.8" y="122.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b81d33" text-anchor="middle">sí</text><path d="M1097.5,165.0 L1097.5,218.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M990.0,250.0 L962.5,250.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M762.5,250.0 L727.5,250.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M527.5,250.0 L497.5,250.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><path d="M287.5,250.0 L262.5,250.0" fill="none" stroke="#4a5163" stroke-width="1.8" marker-end="url(#arr)"/><text x="40" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5163" text-anchor="start">Cualquier paso físico (KEY/RST, cableado D18/D19) se confirma en pantalla. El Loader no abre puertos ni flashea sin pedido del operador.</text><rect x="57.5" y="98.0" width="200" height="64" rx="8" fill="#e4f0ff" stroke="#2d6cb5" stroke-width="1.6"/><text x="157.5" y="119.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">1 · Operación</text><text x="157.5" y="135.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">Puerto COM + destino:</text><text x="157.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">ATmega o ESP</text><rect x="292.5" y="98.0" width="200" height="64" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="392.5" y="119.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">2 · Perfil</text><text x="392.5" y="135.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">rutas {App}/módulos,</text><text x="392.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">config fuera del repo</text><rect x="527.5" y="98.0" width="200" height="64" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="627.5" y="119.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">3 · Compilar / preparar</text><text x="627.5" y="135.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">AVR: avr-gcc + make</text><text x="627.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">ESP: PlatformIO + LittleFS</text><polygon points="862.5,100.0 945.5,130.0 862.5,160.0 779.5,130.0" fill="#fff4d6" stroke="#b9831c" stroke-width="1.6"/><text x="862.5" y="119.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">4 · Confirmaciones</text><text x="862.5" y="135.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">y backup opcional</text><text x="862.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">de flash</text><rect x="990.0" y="95.0" width="215" height="70" rx="8" fill="#efe9ff" stroke="#6a4bb5" stroke-width="1.6"/><text x="1097.5" y="119.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">5 · Flasher temporal en el Mega</text><text x="1097.5" y="135.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">puente USB ↔ USART1 ↔ ESP</text><text x="1097.5" y="151.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">KEY/RST manual o auto (NPN)</text><rect x="990.0" y="218.0" width="215" height="64" rx="8" fill="#efe9ff" stroke="#6a4bb5" stroke-width="1.6"/><text x="1097.5" y="239.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">6 · avrdude (Mega) /</text><text x="1097.5" y="255.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">esptool (ESP) con hash</text><text x="1097.5" y="271.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">verificado en la misma sesión</text><rect x="762.5" y="224.0" width="200" height="52" rx="8" fill="#e3f5ea" stroke="#2a8a52" stroke-width="1.6"/><text x="862.5" y="247.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">7 · Restaura producto</text><text x="862.5" y="263.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">BT01 de arranque</text><rect x="527.5" y="221.0" width="200" height="58" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="627.5" y="247.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">8 · Monitor serie</text><text x="627.5" y="263.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">ASCII / HEX, TX/RX a archivo</text><rect x="287.5" y="218.0" width="210" height="64" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="392.5" y="239.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">9 · Intérprete USB</text><text x="392.5" y="255.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">decodifica el enlace con</text><text x="392.5" y="271.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">wire_catalog.json (TAP)</text><rect x="52.5" y="218.0" width="210" height="64" rx="8" fill="#f3f5f9" stroke="#4a5163" stroke-width="1.6"/><text x="157.5" y="239.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">10 · Servidor MCP</text><text x="157.5" y="255.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">revisión manual de cada</text><text x="157.5" y="271.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2430">solicitud (sin comandos libres)</text></svg>