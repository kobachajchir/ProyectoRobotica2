   <g id="text_9">
    <text style="fill: #4f6178; font: 11.5px 'Inter'; text-anchor: start" x="566.4" y="107.54375" transform="rotate(-0, 566.4, 107.54375)">En el brazo: peso que baja por la torre hacia J1</text>
