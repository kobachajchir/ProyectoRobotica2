   </g>
   <g id="text_20">
    <text style="fill: #132033; font: 12px 'Inter'; text-anchor: start" x="566.4" y="340.47" transform="rotate(-0, 566.4, 340.47)">retuerce el tramo alrededor de su eje</text>
   </g>
   <g id="text_21">
    <text style="fill: #4f6178; font: 11.5px 'Inter'; text-anchor: start" x="566.4" y="359.604844" transform="rotate(-0, 566.4, 359.604844)">En el brazo: carga fuera del plano del brazo, giros de muñeca</text>
   </g>
   <g id="text_22">
    <text style="fill: #4f6178; font: 13px 'Inter'" transform="translate(19.2 335.752953)">Fuerzas (N): N axial y V cortante · Momentos (N·m): M flector y T torsor.</text>
    <text style="fill: #4f6178; font: 13px 'Inter'" transform="translate(19.2 352.550172)">No se suman entre sí: cada uno se dimensiona por separado y después se combinan.</text>
