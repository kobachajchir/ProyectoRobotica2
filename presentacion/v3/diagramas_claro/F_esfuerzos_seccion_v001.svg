   </g>
   <g id="text_16">
    <text style="fill: #132033; font: 12px 'Inter'; text-anchor: start" x="566.4" y="256.557188" transform="rotate(-0, 566.4, 256.557188)">dobla el tramo: tracción arriba, compresión abajo</text>
   </g>
   <g id="text_17">
    <text style="fill: #4f6178; font: 11.5px 'Inter'; text-anchor: start" x="566.4" y="275.627305" transform="rotate(-0, 566.4, 275.627305)">En el brazo: crece hacia el hombro: J2 y el primer eslabón</text>
   </g>
   <g id="text_18">
    <text style="fill: #047857; font: 700 26px 'Inter'; text-anchor: start" x="525.6" y="340.234063" transform="rotate(-0, 525.6, 340.234063)">T</text>
