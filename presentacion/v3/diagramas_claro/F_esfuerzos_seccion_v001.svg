   </g>
   <g id="text_12">
    <text style="fill: #132033; font: 12px 'Inter'; text-anchor: start" x="566.4" y="172.501875" transform="rotate(-0, 566.4, 172.501875)">intenta deslizar una cara sobre la otra</text>
   </g>
   <g id="text_13">
    <text style="fill: #4f6178; font: 11.5px 'Inter'; text-anchor: start" x="566.4" y="191.574297" transform="rotate(-0, 566.4, 191.574297)">En el brazo: peso de cada tramo, perpendicular al tubo</text>
   </g>
   <g id="text_14">
    <text style="fill: #6d28d9; font: 700 26px 'Inter'; text-anchor: start" x="525.6" y="256.234063" transform="rotate(-0, 525.6, 256.234063)">M</text>
