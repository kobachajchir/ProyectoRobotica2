   <g id="text_1">
    <text style="fill: #b45309; font: 700 12.5px 'Inter'; text-anchor: start" x="52.8" y="186.24" transform="rotate(-0, 52.8, 186.24)">Señal analógica continua V_sens(t) + ruido</text>
   </g>
   <g id="text_2">
    <text style="fill: #6d28d9; font: 10.5px 'Inter'; text-anchor: start" x="405.6" y="245.319141" transform="rotate(-0, 405.6, 245.319141)">V_T+ (umbral alto)</text>
   </g>
   <g id="text_3">
    <text style="fill: #8b5cf6; font: 10.5px 'Inter'; text-anchor: start" x="405.6" y="271.21125" transform="rotate(-0, 405.6, 271.21125)">V_T− (umbral bajo)</text>
   </g>
   <g id="text_4">
    <text style="fill: #4f6178; font: 10px 'Inter'" transform="translate(405.6 281.650937)">Banda de histéresis</text>
    <text style="fill: #4f6178; font: 10px 'Inter'" transform="translate(405.6 292.962187)">(fijada por 74HC14D</text>
    <text style="fill: #4f6178; font: 10px 'Inter'" transform="translate(405.6 304.199062)">y ajustada con trimmer)</text>
   </g>
   <g id="text_5">
    <text style="fill: #047857; font: 700 12.5px 'Inter'; text-anchor: start" x="566.4" y="186.24" transform="rotate(-0, 566.4, 186.24)">Salida digital binaria limpia (0 / 1) → ATmega2560</text>
   </g>
   <g id="text_6">
    <text style="fill: #047857; font: 700 10px 'Inter'" transform="translate(534.41875 212.959687)">5 V</text>
    <text style="fill: #047857; font: 700 10px 'Inter'" transform="translate(536.464062 224.143437)">(1)</text>
   </g>
   <g id="text_7">
    <text style="fill: #047857; font: 700 10px 'Inter'" transform="translate(534.41875 296.959687)">0 V</text>
    <text style="fill: #047857; font: 700 10px 'Inter'" transform="translate(536.464062 308.143437)">(0)</text>
   </g>
   <g id="text_8">
    <text style="fill: #132033; font: 700 15px 'Inter'" transform="translate(73.564453 65.903531)">1 · Sensor óptico IR</text>
    <text style="fill: #132033; font: 700 15px 'Inter'" transform="translate(73.5375 82.679156)">(Electrónica Básica)</text>
   </g>
   <g id="text_9">
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(87.817031 102.504287)">LED IR emite luz al piso</text>
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(75.166172 114.635889)">Fototransistor varía corriente</text>
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(55.189922 126.958213)">según reflectancia → V_sens continua</text>
   </g>
   <g id="text_10">
    <text style="fill: #132033; font: 700 15px 'Inter'" transform="translate(377.901562 65.903531)">2 · Trimmer + 74HC14D</text>
    <text style="fill: #132033; font: 700 15px 'Inter'" transform="translate(379.659375 82.679156)">(Umbral con histéresis)</text>
   </g>
   <g id="text_11">
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(371.122617 102.532178)">Trimmer fija punto de disparo (0–3 cm)</text>
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(376.918945 114.719561)">Inversor Schmitt 74HC14D convierte</text>
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(378.522656 127.041885)">la señal analógica en bit sin rebotes</text>
   </g>
   <g id="text_12">
    <text style="fill: #132033; font: 700 15px 'Inter'" transform="translate(708.780469 65.830875)">3 · Salida digital TTL</text>
    <text style="fill: #132033; font: 700 15px 'Inter'" transform="translate(710.325 82.679156)">(Electrónica Digital)</text>
   </g>
   <g id="text_13">
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(706.636172 102.599648)">Bit limpio 0 / 1 en pines IR1..IR5</text>
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(692.755664 114.73125)">Cinta negra = LOW (0 V, LED rojo ON)</text>
    <text style="fill: #4f6178; font: 10.5px 'Inter'" transform="translate(704.254805 126.918633)">Piso blanco = HIGH (5 V) → PINF</text>
   </g>
  </g>
 </g>
